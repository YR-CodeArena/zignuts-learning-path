<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPro - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-xl font-bold tracking-wide">TaskPro</span>
                <span class="text-xs bg-indigo-500 text-indigo-100 py-0.5 px-2 rounded">Personal</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="userGreeting" class="text-sm text-indigo-100"></span>
                <button onclick="logout()" class="bg-indigo-700 hover:bg-indigo-800 text-xs font-semibold py-1.5 px-3 rounded transition">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="alertBox" class="hidden mb-6 p-4 rounded-md text-sm"></div>

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">My Tasks</h1>
                <p class="text-sm text-gray-500">Track and organize your personal milestones</p>
            </div>
            <button onclick="openModal()" class="inline-flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-md shadow-sm transition">
                + Create Task
            </button>
        </div>

        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-3">
            <div class="flex-1">
                <input type="text" id="searchInput" placeholder="Search tasks by title..." oninput="loadTasks()" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="w-full md:w-44">
                <select id="statusFilter" onchange="loadTasks()" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div class="w-full md:w-44">
                <select id="priorityFilter" onchange="loadTasks()" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">All Priorities</option>
                    <option value="Low">Low Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="High">High Priority</option>
                </select>
            </div>
        </div>

        <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <div id="emptyState" class="hidden text-center py-12 bg-white rounded-lg border border-dashed border-gray-300">
            <p class="text-gray-500 text-base">No tasks found.</p>
            <p class="text-gray-400 text-sm mt-1">Get started by creating your first task.</p>
        </div>
    </main>

    <div id="taskModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-gray-800">Add New Task</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>

            <div id="modalAlert" class="hidden mb-4 p-2 text-xs rounded"></div>

            <form id="taskForm" onsubmit="saveTask(event)" class="space-y-4">
                <input type="hidden" id="taskId">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Title</label>
                    <input type="text" id="taskTitle" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Description</label>
                    <textarea id="taskDescription" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Due Date</label>
                        <input type="date" id="taskDueDate" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Priority</label>
                        <select id="taskPriority" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Status</label>
                    <select id="taskStatus" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Pending" selected>Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700 hover:bg-gray-50 transition">Cancel</button>
                    <button type="submit" id="saveBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-sm font-medium transition">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/login/';
        }

        const username = localStorage.getItem('username');
        if (username) {
            document.getElementById('userGreeting').textContent = 'Hello, ' + username;
        }

        function showAlert(message, isError) {
            const box = document.getElementById('alertBox');
            box.textContent = message;
            box.className = isError 
                ? 'mb-6 p-4 rounded-md text-sm bg-red-100 text-red-700 block'
                : 'mb-6 p-4 rounded-md text-sm bg-green-100 text-green-700 block';
            setTimeout(function() {
                box.className = 'hidden mb-6 p-4 rounded-md text-sm';
            }, 3000);
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login/';
        }

        async function loadTasks() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                logout();
                return;
            }

            const search = document.getElementById('searchInput').value;
            const status = document.getElementById('statusFilter').value;
            const priority = document.getElementById('priorityFilter').value;

            let url = '/api/tasks/?';
            if (search) url += 'search=' + encodeURIComponent(search) + '&';
            if (status) url += 'status=' + encodeURIComponent(status) + '&';
            if (priority) url += 'priority=' + encodeURIComponent(priority) + '&';

            try {
                const res = await fetch(url, {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                if (res.status === 401) {
                    logout();
                    return;
                }

                const tasks = await res.json();
                renderTasks(tasks);
            } catch (err) {
                showAlert('Failed to fetch tasks', true);
            }
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            const empty = document.getElementById('emptyState');
            list.innerHTML = '';

            if (!tasks || tasks.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            tasks.forEach(function(task) {
                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-lg border border-gray-200 shadow-sm flex flex-col justify-between hover:shadow transition';

                let priorityClass = 'bg-gray-100 text-gray-700';
                if (task.priority === 'High') priorityClass = 'bg-red-100 text-red-700';
                if (task.priority === 'Medium') priorityClass = 'bg-yellow-100 text-yellow-800';
                if (task.priority === 'Low') priorityClass = 'bg-green-100 text-green-700';

                let statusBadge = task.status === 'Completed'
                    ? '<span class="text-xs font-semibold px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800">Completed</span>'
                    : '<span class="text-xs font-semibold px-2.5 py-0.5 rounded bg-amber-100 text-amber-800">Pending</span>';

                const isDone = task.status === 'Completed';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold uppercase tracking-wider px-2 py-0.5 rounded ${priorityClass}">
                                ${task.priority}
                            </span>
                            ${statusBadge}
                        </div>
                        <h4 class="text-base font-semibold text-gray-900 ${isDone ? 'line-through text-gray-400' : ''}">${task.title}</h4>
                        <p class="text-xs text-gray-600 mt-2 line-clamp-3">${task.description || 'No description provided.'}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-100">
                        <div class="text-xs text-gray-500 mb-3">Due: <span class="font-medium text-gray-700">${task.due_date}</span></div>
                        <div class="flex justify-between items-center gap-2">
                            <button onclick="${isDone ? `markPending(${task.id})` : `markCompleted(${task.id})`}" class="text-xs px-2.5 py-1.5 rounded font-medium ${isDone ? 'bg-gray-100 text-gray-700 hover:bg-gray-200' : 'bg-emerald-600 text-white hover:bg-emerald-700'} transition">
                                ${isDone ? 'Mark Pending' : 'Complete'}
                            </button>
                            <div class="space-x-1">
                                <button onclick='editTask(${JSON.stringify(task)})' class="text-xs px-2.5 py-1.5 rounded bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-medium transition">Edit</button>
                                <button onclick="deleteTask(${task.id})" class="text-xs px-2.5 py-1.5 rounded bg-rose-50 text-rose-600 hover:bg-rose-100 font-medium transition">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function openModal() {
            document.getElementById('taskModal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = 'Add New Task';
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';
            document.getElementById('taskDueDate').valueAsDate = new Date();
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        function editTask(task) {
            document.getElementById('taskModal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = 'Edit Task';
            document.getElementById('taskId').value = task.id;
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDescription').value = task.description || '';
            document.getElementById('taskDueDate').value = task.due_date;
            document.getElementById('taskPriority').value = task.priority;
            document.getElementById('taskStatus').value = task.status;
        }

        async function saveTask(e) {
            e.preventDefault();
            const token = localStorage.getItem('access_token');
            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const due_date = document.getElementById('taskDueDate').value;
            const priority = document.getElementById('taskPriority').value;
            const status = document.getElementById('taskStatus').value;

            const payload = { title, description, due_date, priority, status };
            const method = id ? 'PUT' : 'POST';
            const url = id ? '/api/tasks/' + id + '/' : '/api/tasks/';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (res.status === 401) {
                    logout();
                    return;
                }

                if (res.ok) {
                    closeModal();
                    loadTasks();
                    showAlert(id ? 'Task updated successfully' : 'Task created successfully', false);
                } else {
                    const err = await res.json();
                    let errMsg = '';
                    for (const key in err) {
                        errMsg += key + ': ' + (Array.isArray(err[key]) ? err[key].join(' ') : err[key]) + ' ';
                    }
                    showAlert(errMsg || 'Failed to save task', true);
                }
            } catch (err) {
                showAlert('An unexpected error occurred', true);
            }
        }

        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            const token = localStorage.getItem('access_token');

            try {
                const res = await fetch('/api/tasks/' + id + '/', {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (res.status === 401) {
                    logout();
                    return;
                }

                if (res.ok) {
                    loadTasks();
                    showAlert('Task deleted successfully', false);
                } else {
                    showAlert('Failed to delete task', true);
                }
            } catch (err) {
                showAlert('Network error while deleting task', true);
            }
        }

        async function markCompleted(id) {
            const token = localStorage.getItem('access_token');
            try {
                const res = await fetch('/api/tasks/' + id + '/', {
                    method: 'PATCH',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'Completed' })
                });

                if (res.status === 401) {
                    logout();
                    return;
                }

                if (res.ok) {
                    loadTasks();
                    showAlert('Task marked as completed', false);
                }
            } catch (err) {
                showAlert('Failed to update task status', true);
            }
        }

        async function markPending(id) {
            const token = localStorage.getItem('access_token');
            try {
                const res = await fetch('/api/tasks/' + id + '/', {
                    method: 'PATCH',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'Pending' })
                });

                if (res.status === 401) {
                    logout();
                    return;
                }

                if (res.ok) {
                    loadTasks();
                    showAlert('Task marked as pending', false);
                }
            } catch (err) {
                showAlert('Failed to update task status', true);
            }
        }

        loadTasks();
    </script>
</body>
</html>
