{% extends 'base.html' %}
{% block content %}
<div class="bg-white p-6 sm:p-8 rounded-xl border border-gray-200 shadow-sm">
    <a href="{% url 'post_list' %}" class="text-xs font-semibold text-blue-600 hover:underline mb-4 inline-block">&larr; Back to all posts</a>
    <div class="border-b border-gray-100 pb-4 mb-6">
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">{{ post.title }}</h1>
        <div class="flex items-center space-x-3 text-xs text-gray-500 mt-3">
            <span class="font-medium text-gray-700 bg-gray-100 px-2.5 py-0.5 rounded-full">By {{ post.author.username }}</span>
            <span>&bull;</span>
            <time>{{ post.created_at|date:"M d, Y" }}</time>
        </div>
    </div>
    <div class="text-gray-700 leading-relaxed text-base whitespace-pre-line space-y-4">
        {{ post.content }}
    </div>
    {% if user == post.author %}
        <div class="mt-8 pt-4 border-t border-gray-100 flex items-center space-x-3">
            <a href="{% url 'post_edit' post.pk %}" class="text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-800 px-4 py-2 rounded-lg transition">Edit</a>
            <a href="{% url 'post_delete' post.pk %}" class="text-sm font-medium bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg transition" onclick="return confirm('Delete this post?')">Delete</a>
        </div>
    {% endif %}
</div>
{% endblock %}
