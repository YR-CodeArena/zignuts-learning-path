{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 sm:p-8 rounded-xl border border-gray-200 shadow-sm">
    <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-gray-900">Welcome Back</h1>
        <p class="text-gray-500 text-sm mt-1">Sign in to your account</p>
    </div>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full mt-4 py-2.5 px-4 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition">Sign In</button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-500">
        Don't have an account? <a href="{% url 'register' %}" class="text-blue-600 font-medium hover:underline">Register</a>
    </p>
</div>
{% endblock %}
