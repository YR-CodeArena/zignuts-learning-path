{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 sm:p-8 rounded-xl border border-gray-200 shadow-sm">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Post Form</h1>
        <p class="text-gray-500 text-sm mt-1">Share your thoughts with the community.</p>
    </div>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-100">
            <a href="{% url 'post_list' %}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">Cancel</a>
            <button type="submit" class="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition">Save Post</button>
        </div>
    </form>
</div>
{% endblock %}
