<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.625rem 0.875rem;
            margin-top: 0.35rem;
            margin-bottom: 0.85rem;
            outline: none;
            background-color: #f9fafb;
            font-size: 0.95rem;
            transition: all 0.15s ease-in-out;
        }
        input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
        }
        .helptext {
            display: block;
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: -0.5rem;
            margin-bottom: 0.75rem;
        }
        .errorlist {
            color: #dc2626;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            list-style: disc inside;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col font-sans">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="{% url 'post_list' %}" class="flex items-center space-x-2">
                <span class="bg-blue-600 text-white font-black text-sm px-2.5 py-1 rounded-md">B</span>
                <span class="font-bold text-xl text-gray-900 tracking-tight">DevBlog</span>
            </a>
            <div class="flex items-center space-x-3">
                {% if user.is_authenticated %}
                    <span class="text-sm font-medium text-gray-600 bg-gray-100 px-3 py-1 rounded-full">@{{ user.username }}</span>
                    <a href="{% url 'post_create' %}" class="text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg shadow-sm transition">+ New Post</a>
                    <a href="{% url 'logout' %}" class="text-sm font-medium text-red-600 hover:text-red-700 px-2 py-1 transition">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-sm font-medium text-gray-600 hover:text-gray-900 px-3 py-1.5 transition">Login</a>
                    <a href="{% url 'register' %}" class="text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg shadow-sm transition">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="max-w-3xl w-full mx-auto px-4 py-8 flex-1">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
