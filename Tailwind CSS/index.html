<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Demo</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-semibold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">Active</span>

      </div>
      <h2 class="text-xl font-bold text-slate-900 mb-2">Tailwind Utility Component</h2>

      <div class="flex items-center gap-3">
        <button class="flex-1 bg-blue-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-blue-700 active:scale-95 transition-all text-sm">Action</button>
