<!DOCTYPE html>
<html>
<body>
  <input type="number" id="steps">
  <button onclick="printFibonacci()">Print</button>
  <p id="output"></p>

  <script>
    function printFibonacci() {
      let n = Number(document.getElementById("steps").value);
      let series = [];
      let a = 0;
      let b = 1;

      for (let i = 0; i < n; i++) {
        series.push(a);
        let next = a + b;
        a = b;
        b = next;
      }

      document.getElementById("output").innerHTML = series.join(", ");
    }
  </script>
</body>
</html>
